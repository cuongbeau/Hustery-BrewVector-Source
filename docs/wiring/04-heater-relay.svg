cle cx="400" cy="500" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 504l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="506" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">P17</text><circle cx="400" cy="529" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 533l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="535" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">P16</text><circle cx="400" cy="558" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 562l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="564" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">P4</text><circle cx="400" cy="587" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 591l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="593" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">P0</text><circle cx="400" cy="616" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 620l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="622" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">P2</text><circle cx="400" cy="645" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 649l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="651" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">P15</text><circle cx="400" cy="674" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 678l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="680" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">SD1</text><circle cx="400" cy="703" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 707l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="709" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">SD0</text><circle cx="400" cy="732" r="10" fill="#d4dfcf" stroke="#647e67" stroke-width="1"/><path d="M395 736l10 -8" stroke="#69776a" stroke-width="2"/><text x="366" y="738" text-anchor="end" fill="#b8c7cc" font-size="19" font-weight="400">CLK</text><text x="173" y="785" fill="#c4d6de" font-size="19" font-weight="700">ESP32 / V4 · 38 pins</text><rect x="875" y="165" width="680" height="350" rx="10" fill="#ffffff" stroke="#d1dbe3"/><text x="897" y="203" fill="#173d56" font-size="25" font-weight="700">Ngõ vào điều khiển của hai module</text><g class="wire" data-wire="0"><path d="M140 616H78V842H550V252H875" fill="none" stroke="#f5f8fa" stroke-width="9" stroke-linejoin="round"/><path d="M140 616H78V842H550V252H875" fill="none" stroke="#087eaa" stroke-width="4" stroke-linejoin="round"/><circle cx="140" cy="616" r="4" fill="#087eaa"/><circle cx="875" cy="252" r="7" fill="#087eaa"/><text x="897" y="259" fill="#087eaa" font-size="22" font-weight="700">1. SSR / driver: IN</text></g><g class="wire" data-wire="1"><path d="M140 703H66V868H588V317H875" fill="none" stroke="#f5f8fa" stroke-width="9" stroke-linejoin="round"/><path d="M140 703H66V868H588V317H875" fill="none" stroke="#25313c" stroke-width="4" stroke-linejoin="round"/><circle cx="140" cy="703" r="4" fill="#25313c"/><circle cx="875" cy="317" r="7" fill="#25313c"/><text x="897" y="324" fill="#25313c" font-size="22" font-weight="700">2. SSR / driver: GND</text></g><g class="wire" data-wire="2"><path d="M400 268H596V382H875" fill="none" stroke="#f5f8fa" stroke-width="9" stroke-linejoin="round"/><path d="M400 268H596V382H875" fill="none" stroke="#e17b00" stroke-width="4" stroke-linejoin="round"/><circle cx="400" cy="268" r="4" fill="#e17b00"/><circle cx="875" cy="382" r="7" fill="#e17b00"/><text x="897" y="389" fill="#e17b00" font-size="22" font-weight="700">3. Relay shot: IN</text></g><g class="wire" data-wire="3"><path d="M400 210H634V447H875" fill="none" stroke="#f5f8fa" stroke-width="9" stroke-linejoin="round"/><path d="M400 210H634V447H875" fill="none" stroke="#25313c" stroke-width="4" stroke-linejoin="round"/><circle cx="400" cy="210" r="4" fill="#25313c"/><circle cx="875" cy="447" r="7" fill="#25313c"/><text x="897" y="454" fill="#25313c" font-size="22" font-weight="700">4. Relay shot: GND</text></g><text x="465" y="1000" fill="#426074" font-size="19" font-weight="700">DÂY TRONG TRANG NÀY</text><text x="465" y="1035" fill="#087eaa" font-size="21" font-weight="600">1. P13 → SSR / driver IN</text><text x="1020" y="1035" fill="#25313c" font-size="21" font-weight="600">2. GND → SSR / driver GND</text><text x="465" y="1067" fill="#e17b00" font-size="21" font-weight="600">3. P22 → relay shot IN</text><text x="1020" y="1067" fill="#25313c" font-size="21" font-weight="600">4. GND → relay shot GND</text><text x="895" y="560" fill="#966213" font-size="19" font-weight="700">ĐIỀU KIỆN / PHẦN CHƯA CHỐT</text><text x="895" y="592" fill="#5b4f3a" font-size="18" font-weight="400">SSR / driver phải nhận được tín hiệu GPIO 3,3 V với dòng phù hợp.</text><text x="895" y="621" fill="#5b4f3a" font-size="18" font-weight="400">Không mặc định mọi SSR có thể kích trực tiếp bằng GPIO13.</text><text x="895" y="650" fill="#5b4f3a" font-size="18" font-weight="400">VCC relay / driver: CHƯA XÁC NHẬN, chưa vẽ nối vào 5V / 3V3.</text><text x="895" y="679" fill="#5b4f3a" font-size="18" font-weight="400">Tiếp điểm relay và đầu tải AC của SSR không nằm trong hình.</text><text x="45" y="1120" fill="#193044" font-size="19" font-weight="400">Cọc không được tô: không đấu trong trang này. Đường giao nhau không có chấm: không nối điện.</text><text x="45" y="1148" fill="#8b4226" font-size="18" font-weight="400">Khối module theo TÊN CHÂN, không mô phỏng thứ tự chân vật lý. Ngắt nguồn trước khi đấu. Chưa bao gồm phần AC.</text></svg>