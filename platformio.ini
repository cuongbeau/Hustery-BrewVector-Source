; PlatformIO Configuration — Hustery BrewVector
; Refactored Architecture v2026-04-20

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
extra_scripts = pre:pre_build.py
; Keep old TFT sources for reference, excluded from the active firmware.
build_src_filter = +<*> -<ui/tft/>
build_unflags =
    -std=gnu++11

; Include paths cho cấu trúc thư mục mới (sau khi tách src/ui)
build_flags =
    -std=gnu++17
    ; Default: measured board rate code7, poll3ms, mean7 before publish30ms.
    ; Disable measured override to restore M15 single-shot/raw30ms baseline:
    ; -D ADC_MEASURED_FAST_ACQUISITION=0
    ; Legacy mode below also disables measured override (rate labels assume ADS1115).
    ; -D ADS1115_SINGLE_SHOT_ACQUISITION=0
    -I .
    -I src
    -I src/recovery
    -I interfaces
    -I config


; lib_deps =

lib_deps =
    bblanchon/ArduinoJson
    adafruit/Adafruit MAX31855 library
    adafruit/Adafruit ADS1X15
    madhephaestus/ESP32Encoder
    WebServer
    WiFi
    FS
    SPIFFS
